<script data-purpose="toggle-interactivity">
    // Simple UI interaction for the Live View toggle
    const toggleBtn = document.getElementById('liveViewToggle');
    const toggleDot = document.getElementById('toggleDot');
    let isActive = false;

    toggleBtn.addEventListener('click', () => {
      isActive = !isActive;
      if (isActive) {
        toggleBtn.classList.remove('bg-gray-700');
        toggleBtn.classList.add('bg-gold-primary');
        toggleDot.classList.remove('translate-x-1');
        toggleDot.classList.add('translate-x-6');
      } else {
        toggleBtn.classList.remove('bg-gold-primary');
        toggleBtn.classList.add('bg-gray-700');
        toggleDot.classList.remove('translate-x-6');
        toggleDot.classList.add('translate-x-1');
      }
    });
  </script>
