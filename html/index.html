<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wedding Gala 2024 - Live Gallery</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4c025",
                        "background-light": "#f8f8f5",
                        "background-dark": "#121008",
                        "surface-dark": "#221e10",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121008;
            overflow: hidden;
        }
        .glass-overlay {
            background: rgba(34, 30, 16, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 192, 37, 0.2);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(244, 192, 37, 0.4);
        }
    </style>
</head>
<body class="bg-background-dark text-white font-display h-screen w-screen overflow-hidden">
<!-- Full-Screen Media Container -->
<div class="relative h-full w-full flex flex-col items-center justify-center">
<!-- Main Image Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="Elegant wedding reception table setting with candles and flowers" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA7ZxayKNZorCWJIPIENLnP-7gcBk3Lz3TZhr8PK0Y6FIMyrBrq5bhSlKKpard4_nDc2Ba7tVWPUrd36bX-xievoH4RyN1TPo7uu6eIl_jBduj2GNSynAmtuCPzV9fd1NF5eanXB3jhxt7YPYuZetoMrb05O1z07neYILvHH7a8Btt8t7l_CgpcZ8wj7d3AgU3X9KCluhUA4JJsxPJmRfQ-Sp3-lk18CQhyLu6_oUbX3UGZrS0seKTlAU9Y7AZI9VSPok3eFCswbypU');">
</div>
<!-- Dark Vignette for Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40"></div>
</div>
<!-- Top Navigation / Progress Bar -->
<div class="absolute top-0 left-0 w-full z-20 px-12 py-8 flex flex-col gap-4">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-4">
<div class="size-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-[0.2em] uppercase text-white/90">Wedding Gala 2024</h1>
</div>
<div class="flex items-center gap-6 glass-overlay px-6 py-2 rounded-full">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<p class="text-sm font-semibold tracking-widest text-primary/90">NEXT SLIDE IN 5s</p>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary shadow-[0_0_10px_rgba(244,192,37,0.8)]" style="width: 65%;"></div>
</div>
</div>
<!-- Center Display Area (Implicit) -->
<div class="relative z-10 flex flex-col items-center text-center">
<!-- Space reserved for the main photo focus -->
</div>
<!-- Bottom Layout: Attribution & QR Code -->
<div class="absolute bottom-0 left-0 w-full z-20 p-12 flex items-end justify-between">
<!-- Contributor Attribution -->
<div class="flex flex-col gap-4">
<div class="glass-overlay p-8 rounded-xl flex flex-col gap-2 max-w-md">
<p class="text-primary/70 text-xs font-bold tracking-[0.3em] uppercase">Shared Moments</p>
<h2 class="text-4xl font-bold text-white tracking-tight">Captured by Julianna</h2>
<div class="flex items-center gap-2 mt-2">
<div class="size-2 rounded-full bg-primary animate-pulse"></div>
<p class="text-white/60 text-sm font-medium">Shared 2 minutes ago</p>
</div>
</div>
</div>
<!-- Call to Action & QR Code Hub -->
<div class="flex flex-col items-end gap-6">
<div class="flex items-center gap-6 glass-overlay p-6 rounded-2xl shadow-2xl border-primary/30">
<div class="flex flex-col text-right gap-1">
<h3 class="text-xl font-bold text-white">Join the Gallery</h3>
<p class="text-sm text-white/60 max-w-[220px]">Flashez le QR code ou allez sur diapo-xi.vercel.app/dashboard</p>
<p class="text-xs font-mono text-primary mt-2">diapo-xi.vercel.app/dashboard</p>
</div>
<div class="bg-white p-3 rounded-lg shadow-inner">
<div class="size-32 bg-cover bg-no-repeat" data-alt="QR Code to join the live event gallery" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCyX935RYDnfEtaTv1u9Xk6jFgaR8JSQ3PQrRTEZWHmUksQCf_LQLZGmM4LhM90gGmr4T4KXYJlmNcXc0pynPHa-d56d23IwbyjW8vsu236G1lDUJ1JhHBSaNGGJMcGGLPQWr8dPFxnqzrhNhdrJZgbEFA2oUZ4Ou4w_9URPMrTuqtxfMD9L3KX9Nac2onY05nmp6u_LGLT16HzSfjAP1OTt-mYIe6Os_CHJ5-fmtRYq4Mf3wiwzZqeR-wD1QV735dgxsZxdZIeBzoE');">
</div>
</div>
</div>
<!-- Live Stats (Subtle) -->
<div class="flex gap-4 pr-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">photo_library</span>
<span class="text-white/80 text-xs font-bold tracking-widest uppercase">1,248 Photos</span>
</div>
<div class="flex items-center gap-2 border-l border-white/20 pl-4">
<span class="material-symbols-outlined text-primary text-sm">group</span>
<span class="text-white/80 text-xs font-bold tracking-widest uppercase">142 Guests</span>
</div>
</div>
</div>
</div>
<!-- Subtle Corner Accents -->
<div class="absolute top-0 right-0 w-32 h-32 opacity-10 pointer-events-none">
<div class="absolute top-10 right-10 w-full h-full border-t-2 border-r-2 border-primary"></div>
</div>
<div class="absolute bottom-0 left-0 w-32 h-32 opacity-10 pointer-events-none">
<div class="absolute bottom-10 left-10 w-full h-full border-b-2 border-l-2 border-primary"></div>
</div>
</div>
<!-- Decorative Overlay Grid (Subtle Pattern) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] z-50 bg-[radial-gradient(#f4c025_1px,transparent_1px)] [background-size:40px_40px]"></div>
</body></html>
